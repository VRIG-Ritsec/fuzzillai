name: lint

on:
  push:
    branches: [main]
    paths:
      - '**.swift'
      - '.swiftlint.yml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.swift'
      - '.swiftlint.yml'
      - '.github/workflows/lint.yml'

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          SWIFTLINT_VERSION="0.56.2"
          curl -sL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux.zip" -o swiftlint.zip
          unzip -q swiftlint.zip
          chmod +x swiftlint
          sudo mv swiftlint /usr/local/bin/

      - name: Run SwiftLint
        run: |
          swiftlint version
          swiftlint lint --reporter github-actions-logging Sources/ Tests/
