<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Logs &middot; Fuzzilli</title>
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    .log-shell {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
      min-height: calc(100vh - 220px);
    }
    .log-list {
      overflow: auto;
      max-height: calc(100vh - 220px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel-2);
    }
    .log-search {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 10px;
      display: grid;
      gap: 10px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }
    .log-search input,
    .log-search select { width: 100%; }
    .log-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      display: block;
    }
    .log-item:hover { background: var(--accent-soft); }
    .log-item.active {
      background: var(--accent-soft);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .log-item .name { font-weight: 600; font-size: 13px; }
    .log-item .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

    .log-filters {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .log-filters .wide { grid-column: 1 / -1; }

    .log-view {
      min-height: 480px;
      max-height: calc(100vh - 220px);
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #050507;
      padding: 0;
    }
    .log-view-inner {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
      color: var(--text);
    }
    .log-line {
      padding: 3px 12px;
      white-space: pre-wrap;
      word-break: break-word;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .log-line--error {
      background: rgba(239, 68, 68, 0.08);
      box-shadow: inset 3px 0 0 rgba(239, 68, 68, 0.6);
    }
    .log-line--warn {
      background: rgba(245, 158, 11, 0.08);
      box-shadow: inset 3px 0 0 rgba(245, 158, 11, 0.6);
    }
    .log-line--jump {
      outline: 1px solid var(--accent);
      background: rgba(251, 146, 60, 0.12);
    }
    .log-status {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* IkaCore BoxRenderer.cli_output + logging_utils ANSI mappings */
    .ika-bold { font-weight: 700; }
    .ika-init { color: #facc15; }
    .ika-tool-call { color: #4ade80; }
    .ika-tool-result { color: #f87171; }
    .ika-agent-response { color: #60a5fa; }
    .ika-summarization { color: #e879f9; }
    .ika-cyan { color: #22d3ee; }
    .ika-orange256 { color: #fb923c; }
    .ika-xterm256 { color: #cbd5e1; }

    @media (max-width: 960px) {
      .log-shell { grid-template-columns: 1fr; }
      .log-list { max-height: 260px; }
      .log-filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div>
        <h1>AI <span class="accent">Logs</span></h1>
        <p>IkaCore-style ANSI colors with regex filtering, severity triage, timestamp jump, follow mode, and pause.</p>
      </div>
      <div class="toolbar">
        <nav class="nav" aria-label="Primary">{{NAV}}</nav>
        <button type="button" class="btn btn--primary" id="refreshBtn">
          <span aria-hidden="true">&#8635;</span> Refresh list
        </button>
        <label class="toggle">
          <input type="checkbox" id="autoToggle" checked>
          Auto refresh
        </label>
        <label class="toggle">
          <input type="checkbox" id="followToggle" checked>
          Follow tail
        </label>
        <label class="toggle">
          <input type="checkbox" id="pauseToggle">
          Pause
        </label>
      </div>
    </header>

    <div id="messages" aria-live="polite"></div>

    <section class="card">
      <div class="section-title">
        <h2>Log files</h2>
        <div class="toolbar">
          <select id="logLines" disabled>
            <option value="200">200 lines (tail)</option>
            <option value="500" selected>500 lines (tail)</option>
            <option value="1000">1000 lines (tail)</option>
            <option value="2000">2000 lines (tail)</option>
            <option value="0">Entire file</option>
          </select>
          <button type="button" id="reloadContent" class="btn">Reload content</button>
        </div>
      </div>
      <div class="log-shell">
        <div class="log-list">
          <div class="log-search">
            <input type="search" id="logFilter" placeholder="Filter log files…">
            <input type="search" id="regexFilter" placeholder="Regex filter for log lines">
            <select id="severityFilter">
              <option value="all">All severities</option>
              <option value="error">Errors only</option>
              <option value="warn">Warnings only</option>
              <option value="failure">Failures only</option>
            </select>
          </div>
          <div id="logItems"></div>
        </div>
        <div>
          <div class="log-filters">
            <input class="wide" type="search" id="jumpInput" placeholder="Jump to timestamp or substring in current log">
            <button type="button" class="btn" id="jumpBtn">Jump</button>
            <button type="button" class="btn btn--ghost" id="clearFiltersBtn">Clear line filters</button>
          </div>
          <div id="logStatus" class="log-status">
            <span>No log selected.</span>
          </div>
          <div class="log-view" id="logView">
            <div class="log-view-inner" id="logContent">Choose a log from the list. Content loads only after you select one.</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const state = {
      auto: true,
      follow: true,
      paused: false,
      selectedLog: null,
      timer: null,
      logs: [],
      rawContent: "",
      invalidRegex: "",
      pendingJump: "",
    };

    const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    function escapeHtml(v) {
      return String(v ?? "").replace(/[&<>"']/g, ch => ESC_MAP[ch]);
    }

    function processSgr(seq, push, closeAll) {
      if (seq === "") { closeAll(); return; }
      const rawParts = seq.split(";");
      const nums = [];
      for (const p of rawParts) {
        if (p === "") nums.push(0);
        else {
          const v = parseInt(p, 10);
          if (!Number.isNaN(v)) nums.push(v);
        }
      }
      let i = 0;
      while (i < nums.length) {
        const n = nums[i];
        if (n === 0) { closeAll(); i++; }
        else if (n === 1) { push("ika-bold"); i++; }
        else if (n === 38 && nums[i + 1] === 5 && i + 2 < nums.length) {
          const c256 = nums[i + 2];
          if (c256 === 208) push("ika-orange256");
          else push("ika-xterm256");
          i += 3;
        } else if (n === 22 || n === 39 || n === 49) { i++; }
        else if (n === 93 || n === 33) { push("ika-init"); i++; }
        else if (n === 92 || n === 32) { push("ika-tool-call"); i++; }
        else if (n === 91 || n === 31) { push("ika-tool-result"); i++; }
        else if (n === 94 || n === 34) { push("ika-agent-response"); i++; }
        else if (n === 95 || n === 35) { push("ika-summarization"); i++; }
        else if (n === 96) { push("ika-cyan"); i++; }
        else { i++; }
      }
    }

    function ansiToHtml(source) {
      if (!source) return "";
      const stack = [];
      let out = "";
      const closeAll = () => { while (stack.length) { out += "</span>"; stack.pop(); } };
      const push = (cls) => { out += `<span class="${cls}">`; stack.push(cls); };
      let i = 0;
      while (i < source.length) {
        const c0 = source.charCodeAt(i);
        if (c0 === 0x1b && source[i + 1] === "[") {
          const end = source.indexOf("m", i + 2);
          if (end === -1) { out += escapeHtml(source[i]); i++; continue; }
          const seq = source.slice(i + 2, end);
          processSgr(seq, push, closeAll);
          i = end + 1;
          continue;
        }
        let j = i;
        while (j < source.length) {
          const c = source.charCodeAt(j);
          if (c === 0x1b && source[j + 1] === "[") break;
          j++;
        }
        out += escapeHtml(source.slice(i, j));
        i = j;
      }
      closeAll();
      return out;
    }

    async function fetchJSON(url, options = {}) {
      const res = await fetch(url, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
      return data;
    }

    function showMessage(message, isError = false) {
      const box = document.getElementById("messages");
      box.innerHTML = `
        <div class="alert${isError ? " alert--error" : ""}">
          <span class="alert__icon">${isError ? "!" : "i"}</span>
          <div class="alert__body">
            <div class="alert__title">${isError ? "Error" : "Status"}</div>
            <div>${escapeHtml(message)}</div>
          </div>
          <button type="button" class="alert__close" aria-label="Dismiss">&times;</button>
        </div>`;
      box.querySelector(".alert__close").addEventListener("click", hideMessage);
    }

    function hideMessage() {
      document.getElementById("messages").innerHTML = "";
    }

    function syncLocationQuery() {
      const q = new URLSearchParams(window.location.search);
      if (state.selectedLog) q.set("id", state.selectedLog);
      else q.delete("id");
      const next = `${window.location.pathname}${q.toString() ? `?${q.toString()}` : ""}`;
      window.history.replaceState({}, "", next);
    }

    function classifyLine(line) {
      const lower = line.toLowerCase();
      const isError = /traceback|exception|fatal|error|failed|crash|sqlstate|panic/.test(lower);
      const isWarn = /warning|warn|retry|timeout|stalled|stale/.test(lower);
      const isFailure = /traceback|exception|fatal|error|failed|crash/.test(lower);
      return {
        classes: [
          isError ? "log-line--error" : "",
          !isError && isWarn ? "log-line--warn" : "",
        ].filter(Boolean),
        severity: isError ? "error" : isWarn ? "warn" : "info",
        failure: isFailure,
      };
    }

    function buildRegex() {
      const raw = document.getElementById("regexFilter").value.trim();
      if (!raw) {
        state.invalidRegex = "";
        return null;
      }
      try {
        state.invalidRegex = "";
        return new RegExp(raw, "i");
      } catch (err) {
        state.invalidRegex = err.message;
        return null;
      }
    }

    function updateLogListSelection() {
      document.querySelectorAll("#logItems [data-log-id]").forEach(btn => {
        const on = state.selectedLog && btn.dataset.logId === state.selectedLog;
        btn.classList.toggle("active", on);
      });
    }

    function renderLogItems(logs) {
      const container = document.getElementById("logItems");
      container.innerHTML = logs.map(item => `
        <button type="button" class="log-item" data-log-id="${item.id}">
          <div class="name">${escapeHtml(item.label)}</div>
          <div class="meta">${escapeHtml(item.modified_at)} &middot; ${item.size} bytes</div>
        </button>`).join("") || '<div class="empty">No logs match.</div>';
      container.querySelectorAll("[data-log-id]").forEach(btn => {
        btn.addEventListener("click", () => loadLogContent(btn.dataset.logId));
      });
      updateLogListSelection();
    }

    function applyLogListFilter() {
      const term = document.getElementById("logFilter").value.trim().toLowerCase();
      if (!term) { renderLogItems(state.logs); return; }
      const filtered = state.logs.filter(l => l.label.toLowerCase().includes(term));
      renderLogItems(filtered);
    }

    function renderLogStatus(visibleCount, totalCount) {
      const linesSel = document.getElementById("logLines");
      const parts = [];
      if (state.selectedLog) parts.push(`selected=${state.selectedLog.slice(0, 16)}...`);
      parts.push(`lines shown=${visibleCount}/${totalCount}`);
      parts.push(`tail=${linesSel.value === "0" ? "entire file" : `${linesSel.value} lines`}`);
      parts.push(`follow=${state.follow ? "on" : "off"}`);
      parts.push(`paused=${state.paused ? "yes" : "no"}`);
      if (state.invalidRegex) parts.push(`regex error=${state.invalidRegex}`);
      document.getElementById("logStatus").innerHTML = parts.map(part => `<span>${escapeHtml(part)}</span>`).join("");
    }

    function scrollToPendingJump() {
      if (!state.pendingJump) return;
      const target = document.querySelector(".log-line--jump");
      if (target) target.scrollIntoView({ block: "center" });
      state.pendingJump = "";
    }

    function renderCurrentLogContent() {
      const content = document.getElementById("logContent");
      const view = document.getElementById("logView");
      const severity = document.getElementById("severityFilter").value;
      const regex = buildRegex();
      const jumpTerm = document.getElementById("jumpInput").value.trim();
      const rawLines = state.rawContent ? state.rawContent.split(/\r?\n/) : [];
      let matchedJump = false;
      const prevScroll = view.scrollTop;
      const prevHeight = view.scrollHeight;

      if (state.invalidRegex) {
        showMessage(`Invalid regex: ${state.invalidRegex}`, true);
      }

      const rendered = [];
      for (const line of rawLines) {
        const meta = classifyLine(line);
        if (severity === "error" && meta.severity !== "error") continue;
        if (severity === "warn" && meta.severity !== "warn") continue;
        if (severity === "failure" && !meta.failure) continue;
        if (regex && !regex.test(line)) continue;
        const classes = ["log-line", ...meta.classes];
        if (!matchedJump && jumpTerm && line.includes(jumpTerm)) {
          classes.push("log-line--jump");
          matchedJump = true;
        }
        rendered.push(`<div class="${classes.join(" ")}">${ansiToHtml(line || " ")}</div>`);
      }

      content.innerHTML = rendered.join("") || '<div class="empty" style="padding:14px;">No log lines match the current filters.</div>';
      renderLogStatus(rendered.length, rawLines.length);
      if (state.pendingJump || jumpTerm) {
        scrollToPendingJump();
        return;
      }
      if (state.follow) {
        view.scrollTop = view.scrollHeight;
      } else {
        const delta = view.scrollHeight - prevHeight;
        view.scrollTop = prevScroll + Math.max(0, delta);
      }
    }

    async function loadLogList() {
      const data = await fetchJSON("/api/logs");
      state.logs = data.logs || [];
      applyLogListFilter();
      return state.logs;
    }

    async function loadLogContent(logId) {
      state.selectedLog = logId;
      syncLocationQuery();
      const el = document.getElementById("logContent");
      const linesSel = document.getElementById("logLines");
      linesSel.disabled = false;
      el.innerHTML = '<div class="muted" style="padding:14px;"><span class="spinner"></span> Loading…</div>';
      const lines = linesSel.value;
      const data = await fetchJSON(`/api/logs/content?id=${encodeURIComponent(logId)}&lines=${lines}`);
      state.rawContent = data.content || "";
      renderCurrentLogContent();
      updateLogListSelection();
    }

    function readIdFromQuery() {
      return new URLSearchParams(window.location.search).get("id") || null;
    }

    async function init() {
      try {
        hideMessage();
        const logs = await loadLogList();
        const fromUrl = readIdFromQuery();
        const pick = fromUrl && logs.some(l => l.id === fromUrl) ? fromUrl : null;
        if (pick) {
          await loadLogContent(pick);
        } else {
          state.selectedLog = null;
          document.getElementById("logLines").disabled = true;
          document.getElementById("logContent").textContent =
            "Choose a log from the list. Content loads only after you select one.";
          renderLogStatus(0, 0);
        }
      } catch (err) {
        showMessage(err.message, true);
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", async () => {
      try {
        hideMessage();
        await loadLogList();
      } catch (err) {
        showMessage(err.message, true);
      }
    });
    document.getElementById("reloadContent").addEventListener("click", () => {
      if (state.selectedLog) loadLogContent(state.selectedLog);
    });
    document.getElementById("logLines").addEventListener("change", () => {
      if (state.selectedLog) loadLogContent(state.selectedLog);
    });
    document.getElementById("autoToggle").addEventListener("change", (e) => {
      state.auto = e.target.checked;
    });
    document.getElementById("followToggle").addEventListener("change", (e) => {
      state.follow = e.target.checked;
    });
    document.getElementById("pauseToggle").addEventListener("change", (e) => {
      state.paused = e.target.checked;
      renderLogStatus(state.rawContent ? state.rawContent.split(/\r?\n/).length : 0, state.rawContent ? state.rawContent.split(/\r?\n/).length : 0);
    });
    document.getElementById("logFilter").addEventListener("input", applyLogListFilter);
    document.getElementById("regexFilter").addEventListener("input", () => {
      hideMessage();
      renderCurrentLogContent();
    });
    document.getElementById("severityFilter").addEventListener("change", renderCurrentLogContent);
    document.getElementById("jumpBtn").addEventListener("click", () => {
      state.pendingJump = document.getElementById("jumpInput").value.trim();
      renderCurrentLogContent();
    });
    document.getElementById("jumpInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        state.pendingJump = document.getElementById("jumpInput").value.trim();
        renderCurrentLogContent();
      }
    });
    document.getElementById("clearFiltersBtn").addEventListener("click", () => {
      document.getElementById("regexFilter").value = "";
      document.getElementById("severityFilter").value = "all";
      document.getElementById("jumpInput").value = "";
      state.pendingJump = "";
      hideMessage();
      renderCurrentLogContent();
    });

    init();
    state.timer = setInterval(async () => {
      if (!state.auto) return;
      try {
        await loadLogList();
        if (state.selectedLog && !state.paused) {
          await loadLogContent(state.selectedLog);
        }
      } catch (_) {
      }
    }, 12000);
  </script>
</body>
</html>
