
services:
  postgres-master:
    image: postgres:15-alpine
    shm_size: '2gb'
    container_name: fuzzilli-postgres-master
    environment:
      POSTGRES_DB: fuzzilli_master
      POSTGRES_USER: fuzzilli
      POSTGRES_PASSWORD: fuzzilli123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - /mnt/vdc/new-postgres-data/:/var/lib/postgresql/data
      - /home/aleksi/fuzzillai/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzzilli -d fuzzilli_master"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fuzzing-network

networks:
  fuzzing-network:
    driver: bridge

